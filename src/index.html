<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aniversário Rock</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- style css -->
    <link rel="stylesheet" href="./styles/main.scss">
    
    <!-- AOS Animações -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

<header class="hero">
    <div class="container">
        <img class="hero__logo" src="./images/aniversariante.png" alt="Aniversariante">

        <p class="hero__text">
            A maior comemoração começa em <span id="contador"></span>
        </p>

        <div class="infos-bar">
            <ul class="infos-bar__infos">
                <li class="infos-bar__infos__item">
                    <b>Localização</b>
                    Clube Comercial - Centro - Taquara
                </li>
                <li class="infos-bar__infos__item">
                    <b>Quando</b>
                    19/08/2026 às 19h
                </li>
            </ul>

            <a href="#" class="button button--primary">
                Confirme a sua presença
            </a>
        </div>
    </div>
</header>

<section id="redes-sociais">
    <h2>Redes Sociais</h2>
    <div class="social-links">
        <a href="#"><i class='bx bxl-github'></i> GitHub</a>
        <a href="https://vercel.com" target="_blank"><i class='bx bx-cloud'></i> Vercel</a>
        <a href="#"><i class='bx bxl-linkedin-square'></i> LinkedIn</a>
        <a href="#"><i class='bx bxl-instagram'></i> Instagram</a>
    </div>
</section>

<footer>
    <p>© 2026 | Festa de Aniversário</p>
</footer>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script src="./scripts/main.js"></script>

</body>
</html>
